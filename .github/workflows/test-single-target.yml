name: Test Single Target

on:
  workflow_dispatch:
    inputs:
      package_mode:
        description: "Package mode"
        required: false
        default: "package"
        type: choice
        options:
          - package
          - build_only
      target:
        description: "Target system to build"
        required: true
        default: "ubuntu-24.04"
        type: choice
        options:
          - alpine-3.23
          - debian-13
          - ubuntu-24.04
          - windows-2022
      td_ref:
        description: "TDLib git branch/tag/commit"
        required: true
        default: "master"
        type: choice
        options:
          - "master"
      run_checks:
        description: "Run fmt/test/clippy before release build"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: read

env:
  ARTIFACT_PREFIX: transfer_bot
  CARGO_TERM_COLOR: always
  PACKAGE_MODE: ${{ github.event.inputs.package_mode || 'package' }}
  TD_GIT_REF: ${{ github.event.inputs.td_ref || 'master' }}
  RUN_CHECKS: ${{ github.event.inputs.run_checks || 'true' }}

jobs:
  linux-single:
    name: Linux ${{ matrix.label }}
    if: github.event.inputs.target != 'windows-2022'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: alpine-3.23
            label: Alpine 3.23 musl x86_64
            image: alpine:3.23
            artifact_suffix: linux-x86_64-alpine3.23-test
          - id: debian-13
            label: Debian 13 glibc x86_64
            image: debian:13
            artifact_suffix: linux-x86_64-debian13-test
          - id: ubuntu-24.04
            label: Ubuntu 24.04 glibc x86_64
            image: ubuntu:24.04
            artifact_suffix: linux-x86_64-ubuntu24.04-test
    steps:
      - name: Skip non-selected targets
        if: matrix.id != github.event.inputs.target
        run: echo "skip ${{ matrix.id }}"

      - name: Checkout repository
        if: matrix.id == github.event.inputs.target
        uses: actions/checkout@v4

      - name: Restore Linux build cache
        if: matrix.id == github.event.inputs.target
        uses: actions/cache@v4
        with:
          path: |
            .ci-cache/linux/${{ matrix.id }}/cargo-home
            .ci-cache/linux/${{ matrix.id }}/rustup
            .ci-cache/linux/${{ matrix.id }}/target
          key: ${{ runner.os }}-linux-build-${{ matrix.id }}-${{ hashFiles('Cargo.lock', '.github/scripts/build_linux_package.sh', '.github/workflows/release-packages.yml', '.github/workflows/test-single-target.yml') }}
          restore-keys: |
            ${{ runner.os }}-linux-build-${{ matrix.id }}-

      - name: Prepare Linux cache dirs
        if: matrix.id == github.event.inputs.target
        run: |
          mkdir -p ".ci-cache/linux/${{ matrix.id }}/cargo-home"
          mkdir -p ".ci-cache/linux/${{ matrix.id }}/rustup"
          mkdir -p ".ci-cache/linux/${{ matrix.id }}/target"

      - name: Build selected Linux target
        if: matrix.id == github.event.inputs.target
        run: |
          set -eux
          docker run --rm \
            -v "$PWD:/work" \
            -v "$PWD/.ci-cache/linux/${{ matrix.id }}/cargo-home:/root/.cargo" \
            -v "$PWD/.ci-cache/linux/${{ matrix.id }}/rustup:/root/.rustup" \
            -v "$PWD/.ci-cache/linux/${{ matrix.id }}/target:/work/target" \
            -w /work \
            -e "CI_DISTRO_ID=${{ matrix.id }}" \
            -e "CI_IMAGE=${{ matrix.image }}" \
            -e "CI_ARTIFACT_NAME=${{ env.ARTIFACT_PREFIX }}-${{ matrix.artifact_suffix }}" \
            -e "PACKAGE_MODE=${PACKAGE_MODE}" \
            -e "TD_GIT_REF=${TD_GIT_REF}" \
            -e "RUN_CHECKS=${RUN_CHECKS}" \
            -e "PACKAGE_RETENTION_KIND=test" \
            "${{ matrix.image }}" sh "/work/.github/scripts/build_linux_package.sh"

      - name: Upload Linux test package
        if: matrix.id == github.event.inputs.target && env.PACKAGE_MODE != 'build_only'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_PREFIX }}-${{ matrix.artifact_suffix }}
          path: dist/${{ env.ARTIFACT_PREFIX }}-${{ matrix.artifact_suffix }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  windows-single:
    name: Windows Server 2022 MSVC x86_64
    if: github.event.inputs.target == 'windows-2022'
    runs-on: windows-2022
    env:
      CI_ARTIFACT_NAME: transfer_bot-windows-x86_64-msvc-test
      CARGO_TARGET_DIR: ${{ github.workspace }}\.ci-cache\windows\target
      LOCAL_TDLIB_PATH: ${{ github.workspace }}\tdlib-install
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\.ci-cache\windows\vcpkg-archives
      VCPKG_DEFAULT_TRIPLET: x64-windows
      VCPKG_INSTALLATION_ROOT: ${{ github.workspace }}\.ci-cache\windows\vcpkg-root
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy

      - name: Restore Windows build cache
        uses: actions/cache@v4
        with:
          path: |
            ~\.cargo\registry
            ~\.cargo\git
            .ci-cache/windows/target
            .ci-cache/windows/vcpkg-root
            .ci-cache/windows/vcpkg-archives
          key: ${{ runner.os }}-windows-build-msvc-${{ hashFiles('Cargo.lock', '.github/scripts/build_windows_package.ps1', '.github/workflows/release-packages.yml', '.github/workflows/test-single-target.yml') }}
          restore-keys: |
            ${{ runner.os }}-windows-build-msvc-

      - name: Prepare Windows cache dirs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ".ci-cache/windows/target" | Out-Null
          New-Item -ItemType Directory -Force ".ci-cache/windows/vcpkg-root" | Out-Null
          New-Item -ItemType Directory -Force ".ci-cache/windows/vcpkg-archives" | Out-Null

      - name: Prepare Windows dependencies
        shell: pwsh
        run: |
          $env:PACKAGE_MODE = "${env:PACKAGE_MODE}"
          $env:PACKAGE_RETENTION_KIND = "test"
          & ".github/scripts/build_windows_package.ps1"

      - name: Upload Windows test package
        if: env.PACKAGE_MODE != 'build_only'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.CI_ARTIFACT_NAME }}
          path: dist/${{ env.CI_ARTIFACT_NAME }}.zip
          if-no-files-found: error
          retention-days: 7
