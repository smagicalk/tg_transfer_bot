[package]
name = "transfer_bot"
version = "0.1.0"
edition = "2024"

[dependencies]
tdlib-rs = {workspace = true}

tokio = {version = "1.50.0",features = ["full"]}
futures = {version = "0.3.32",features = ["default"]}
parking_lot = {version = "0.12.5"}

serde = {version = "1.0.228"}
serde_json = {version = "1.0.149"}

clap = {version = "4.5.60",features = ["default","usage","derive"]}
inquire = {version = "0.9.4",features = ["default","console","macros"]}

tracing = {version = "0.1.44",features = []}
tracing-subscriber = {version = "0.3.22",features = ["env-filter","serde_json","json","local-time","chrono","parking_lot"]}
file-rotate = "0.8.0"

anyhow = "1.0.102"
thiserror = "2.0.18"

qrcode = {version = "0.14.1",features = ["default"]}

sea-orm = {version = "2.0.0-rc.37",features = ["default","macros","runtime-tokio-rustls","sqlx-sqlite"]}
migration = {path = "../migration"}

aes-gcm = "0.11.0-rc.3"
argon2 = "0.6.0-rc.7"
rand = "0.10.0"
base64 = "0.22.1"
tracing-appender = "0.2.4"
once_cell = "1.21.3"
log = "0.4.29"
chrono = "0.4.44"


[dev-dependencies]
tokio = {version = "1.50.0",features = ["test-util"]}

mockall = {version = "0.14.0",features = []}
sea-orm = {version = "2.0.0-rc.37",features = ["default","mock","debug-print"]}


